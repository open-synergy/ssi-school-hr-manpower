      - step: "Run the import"
        action: "call"
        target: "wizard"
        method: "action_confirm"
      - step: "Find the plan line of subject_math"
        action: "search"
        model: "manpower_planning_teaching"
        domain:
          - ["planning_id", "=", "REC: planning.id"]
          - ["subject_id", "=", "REC: subject_math.id"]
        save_as: "plan_math"
        expect_count: 1
      - step: "No co-teacher is set and only the main lines are linked"
        action: "assert"
        target: "plan_math"
        asserts:
          co_employee_id:
            type: "value"
            operator: "is_falsy"
          teaching_assignment_line_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: line_math_1"
              - "REC: line_math_2"

  - name: "Import Teaching - A term is required"
    steps:
      - step: "The wizard cannot be saved without an academic term"
        action: "form"
        model: "import_teaching_assignment"
        context:
          active_model: "manpower_planning"
          active_id: "REC: planning.id"
        expect_error:
          type: "AssertionError"
          message_contains: "required field"
        ops:
          - assert:
              planning_id:
                type: "m2o"
                expected: "REC: planning"

  - name: "Import Teaching - A planning without school is rejected"
    steps:
      - step: "Create a planning without school"
        action: "create"
        model: "manpower_planning"
        save_as: "planning_no_school"
        values:
          department_id: "REC: department.id"
          date_start: 2026-07-01
          date_end: 2027-06-30
      - step: "Create the wizard of that planning"
        action: "create"
        model: "import_teaching_assignment"
        save_as: "wizard"
        values:
          planning_id: "REC: planning_no_school.id"
          academic_term_id: "REC: term_1.id"
      - step: "The import is rejected"
        action: "call"
        target: "wizard"
        method: "action_confirm"
        expect_error:
          type: "UserError"
          message_contains: "not in draft or has no school"

  - name:
      "Import Teaching - A school planning without teaching lines still goes through
      approval"
    steps:
      - step: "Create a job"
        action: "create"
        model: "hr.job"
        save_as: "job"
        values:
          name: "MPPI Job"
      - step: "Create a school planning with a formation only"
        action: "create"
        model: "manpower_planning"
        save_as: "planning_formation"
        values:
          department_id: "REC: department.id"
          school_id: "REC: school.id"
          academic_year_id: "REC: year.id"
          date_start: 2026-07-01
          date_end: 2027-06-30
          formation_ids:
            - - 0
              - 0
              - job_id: "REC: job.id"
                quantity: 1
      - step: "Confirm the planning"
        action: "call"
        target: "planning_formation"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve the planning"
        action: "call"
        target: "planning_formation"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
