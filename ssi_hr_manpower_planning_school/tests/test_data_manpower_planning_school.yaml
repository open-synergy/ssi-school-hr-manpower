options:
  auto_refresh: true

setup:
  steps:
    - step: "Create grade type"
      action: "create"
      model: "school_grade_type"
      save_as: "grade_type"
      values:
        name: "MPP School Context Grade Type"
        code: "/"
        sequence: 10
    - step: "Create branch"
      action: "create"
      model: "school_branch"
      save_as: "branch"
      values:
        name: "MPP School Context Branch"
        code: "/"
    - step: "Create school of the branch"
      action: "create"
      model: "school"
      save_as: "school"
      values:
        name: "MPP School Context"
        code: "/"
        grade_type_id: "REC: grade_type.id"
        branch_id: "REC: branch.id"
    - step: "Create school without any curriculum"
      action: "create"
      model: "school"
      save_as: "school_empty"
      values:
        name: "MPP School Without Curriculum"
        code: "/"
        grade_type_id: "REC: grade_type.id"
    - step: "Create academic year"
      action: "create"
      model: "school_academic_year"
      save_as: "year"
      values:
        name: "MPP 2026/2027 Context"
        code: "/"
        date_start: "2026-07-01"
        date_end: "2027-06-30"
    - step: "Create grade X"
      action: "create"
      model: "school_grade"
      save_as: "grade_x"
      values:
        name: "MPP Context Grade X"
        code: "/"
        sequence: 10
        type_id: "REC: grade_type.id"
    - step: "Create grade XI"
      action: "create"
      model: "school_grade"
      save_as: "grade_xi"
      values:
        name: "MPP Context Grade XI"
        code: "/"
        sequence: 20
        type_id: "REC: grade_type.id"
    - step: "Create class X-1 of the school"
      action: "create"
      model: "school_grade_class"
      save_as: "class_1"
      values:
        name: "MPP Context X-1"
        code: "/"
        school_id: "REC: school.id"
        grade_id: "REC: grade_x.id"
    - step: "Create class X-2 of the school"
      action: "create"
      model: "school_grade_class"
      save_as: "class_2"
      values:
        name: "MPP Context X-2"
        code: "/"
        school_id: "REC: school.id"
        grade_id: "REC: grade_x.id"
    - step: "Create a class X-1 of the school without curriculum"
      action: "create"
      model: "school_grade_class"
      save_as: "class_empty"
      values:
        name: "MPP Context Empty X-1"
        code: "/"
        school_id: "REC: school_empty.id"
        grade_id: "REC: grade_x.id"
    - step: "Create mathematics taught on grade X"
      action: "create"
      model: "school_subject"
      save_as: "subject_math"
      values:
        name: "MPP Context Mathematics"
        code: "/"
        grade_ids:
          - - 6
            - 0
            - - "REC: grade_x.id"
    - step: "Create history taught on grade XI only"
      action: "create"
      model: "school_subject"
      save_as: "subject_history"
      values:
        name: "MPP Context History"
        code: "/"
        grade_ids:
          - - 6
            - 0
            - - "REC: grade_xi.id"
    - step: "Create department"
      action: "create"
      model: "hr.department"
      save_as: "department"
      values:
        name: "MPP School Context Department"
    - step: "Create the draft curriculum of the school"
      action: "create"
      model: "school_curriculum"
      save_as: "curriculum"
      values:
        title: "MPP Context Curriculum"
        school_id: "REC: school.id"
        academic_year_id: "REC: year.id"
        effective_start: 2026-07-01
        effective_end: 2027-06-30
        user_id: "REF: base.user_admin"
    - step: "Curriculum line of mathematics on grade X, 4 hours"
      action: "create"
      model: "school_curriculum_line"
      save_as: "curriculum_line_math"
      values:
        curriculum_id: "REC: curriculum.id"
        subject_id: "REC: subject_math.id"
        grade_id: "REC: grade_x.id"
        weekly_hours: 4
        total_class: 2
    - step: "Curriculum line of history on grade XI, a grade without class"
      action: "create"
      model: "school_curriculum_line"
      save_as: "curriculum_line_history"
      values:
        curriculum_id: "REC: curriculum.id"
        subject_id: "REC: subject_history.id"
        grade_id: "REC: grade_xi.id"
        weekly_hours: 3
        total_class: 1
    - step: "Confirm the curriculum"
      action: "call"
      target: "curriculum"
      method: "action_confirm"
      as_user: "base.user_admin"
      refresh: true
      asserts:
        state:
          type: "value"
          expected: "confirm"
    - step: "Approve the curriculum, which opens it"
      action: "call"
      target: "curriculum"
      method: "action_approve_approval"
      as_user: "base.user_admin"
      refresh: true
      asserts:
        state:
          type: "value"
          expected: "open"

scenarios:
  - name: "Manpower Planning School - Context is stored and branch follows the school"
    steps:
      - step: "Create planning with school context"
        action: "create"
        model: "manpower_planning"
        save_as: "planning"
        values:
          department_id: "REC: department.id"
          date_start: 2026-07-01
          date_end: 2027-06-30
          school_id: "REC: school.id"
          academic_year_id: "REC: year.id"
          curriculum_id: "REC: curriculum.id"
      - step: "School, branch, year and curriculum are stored"
        action: "assert"
        target: "planning"
        asserts:
          school_id:
            type: "m2o"
            expected: "REC: school"
          school_branch_id:
            type: "m2o"
            expected: "REC: branch"
          academic_year_id:
            type: "m2o"
            expected: "REC: year"
          curriculum_id:
            type: "m2o"
            expected: "REC: curriculum"

  - name: "Manpower Planning School - Planning without school data keeps working"
    steps:
      - step: "Create department"
        action: "create"
        model: "hr.department"
        save_as: "department"
        values:
          name: "MPP Plain Department"
      - step: "Create planning without any school field"
        action: "create"
        model: "manpower_planning"
        save_as: "planning"
        values:
          department_id: "REC: department.id"
          date_start: 2026-01-01
          date_end: 2026-12-31
      - step: "School fields stay empty and there are no workload lines"
        action: "assert"
        target: "planning"
        asserts:
          school_id:
            type: "value"
            operator: "is_falsy"
          school_branch_id:
            type: "value"
            operator: "is_falsy"
          academic_year_id:
            type: "value"
            operator: "is_falsy"
          curriculum_id:
            type: "value"
            operator: "is_falsy"
          workload_ids:
            type: "o2m"
            check: "count"
            expected_count: 0

  - name: "Manpower Planning School - Academic year fills the planning period"
    steps:
      - step: "Create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "year"
        values:
          name: "MPP 2027/2028 Onchange"
          code: "/"
          date_start: "2027-07-01"
          date_end: "2028-06-30"
      - step: "Create department"
        action: "create"
        model: "hr.department"
        save_as: "department"
        values:
          name: "MPP Onchange Department"
      - step: "Pick the academic year in the planning form"
        action: "form"
        model: "manpower_planning"
        save_as: "planning"
        values:
          department_id: "REC: department"
          academic_year_id: "REC: year"
      - step: "The planning period follows the academic year"
        action: "assert"
        target: "planning"
        asserts:
          date_start:
            type: "value"
            expected: 2027-07-01
          date_end:
            type: "value"
            expected: 2028-06-30

  - name: "Manpower Planning School - School without curriculum fills nothing"
    steps:
      - step: "Pick the school without curriculum in the planning form"
        action: "form"
        model: "manpower_planning"
        save_as: "planning_empty"
        values:
          department_id: "REC: department"
          date_start: 2026-07-01
          date_end: 2027-06-30
          school_id: "REC: school_empty"
      - step: "The curriculum stays empty"
        action: "assert"
        target: "planning_empty"
        asserts:
          curriculum_id:
            type: "value"
            operator: "is_falsy"

  - name: "Manpower Planning School - School fills the open curriculum"
    steps:
      - step: "Pick the school in the planning form"
        action: "form"
        model: "manpower_planning"
        save_as: "planning_form"
        values:
          department_id: "REC: department"
          date_start: 2026-07-01
          date_end: 2027-06-30
          school_id: "REC: school"
      - step: "The open curriculum of the school is filled"
        action: "assert"
        target: "planning_form"
        asserts:
          curriculum_id:
            type: "m2o"
            expected: "REC: curriculum"

  - name: "Manpower Planning School - Curriculum model of the module is gone"
    steps:
      - step: "The registry has no manpower planning curriculum model"
        action: "search"
        model: "ir.model"
        domain:
          - ["model", "=", "manpower_planning_curriculum"]
        save_as: "gone_model"
        expect_count: 0

  - name: "Manpower Planning School - Planning without curriculum goes through approval"
    steps:
      - step: "Create a job"
        action: "create"
        model: "hr.job"
        save_as: "job"
        values:
          name: "MPP Context Job"
      - step: "Create a non-teacher employee"
        action: "create"
        model: "hr.employee"
        save_as: "staff"
        values:
          name: "MPP Context Staff"
      - step: "Create a non-teacher assignment type"
        action: "create"
        model: "manpower_planning_assignment_type"
        save_as: "type_staff"
        values:
          name: "MPP Context Administration"
          code: "/"
          category: "non_teacher"
          hour_basis: "week"
          default_hours: 40
      - step: "Create a school planning with no curriculum, formation only"
        action: "create"
        model: "manpower_planning"
        save_as: "planning_staff"
        values:
          department_id: "REC: department.id"
          school_id: "REC: school_empty.id"
          date_start: 2026-07-01
          date_end: 2027-06-30
          formation_ids:
            - - 0
              - 0
              - job_id: "REC: job.id"
                employee_id: "REC: staff.id"
                quantity: 1
      - step: "Add a non-teacher assignment line"
        action: "create"
        model: "manpower_planning_assignment"
        save_as: "assignment_staff"
        values:
          planning_id: "REC: planning_staff.id"
          type_id: "REC: type_staff.id"
          employee_id: "REC: staff.id"
          hours: 40
      - step: "The planning has no curriculum and no teaching line"
        action: "assert"
        target: "planning_staff"
        asserts:
          curriculum_id:
            type: "value"
            operator: "is_falsy"
          teaching_ids:
            type: "o2m"
            check: "count"
            expected_count: 0
      - step: "Confirm the planning"
        action: "call"
        target: "planning_staff"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve the planning"
        action: "call"
        target: "planning_staff"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Mark the planning as done"
        action: "call"
        target: "planning_staff"
        method: "action_done"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"
